services:
  db:
    image: postgres:16
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_USER: admission
      POSTGRES_PASSWORD: admission
      POSTGRES_DB: admission
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  api:
    build: ./backend/src/SchoolAdmission.Api
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=admission;Username=admission;Password=admission;Maximum Pool Size=100;Timeout=60"
      HOLD_DURATION_SECONDS: "${HOLD_DURATION_SECONDS:-600}"
    depends_on:
      - db
  frontend:
    build: ./frontend
    ports:
      - "3001:80"
    environment:
      API_URL: "http://localhost:8080"
    depends_on:
      - api

volumes:
  dbdata: